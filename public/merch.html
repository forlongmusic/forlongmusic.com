    <!-- ==================================================
         ART GALLERY
         To add a piece: copy one <figure> block, then change
         the image file and the caption. Put image files in
         the images folder.
         ================================================== -->
    <section class="art">
      <h1>art</h1>

      <!-- Portrait photos (3:4) -->
      <div class="gallery">
        <figure class="snapshot">
          <img class="portrait" src="images/IMG_4670.JPG" alt="snowy trees by a frozen pond under a blue sky" loading="lazy">
        </figure>
        <figure class="snapshot">
          <img class="portrait" src="images/IMG_4722.JPG" alt="person in a black coat and blue beanie by a snowy lamppost" loading="lazy">
        </figure>
        <figure class="snapshot">
          <img class="portrait" src="images/geese.jpg" alt="Canada geese and a duck floating on a bright green pond" loading="lazy">
        </figure>
      </div>

      <!-- Square photos (1:1) -->
      <div class="gallery">
        <figure class="snapshot">
          <img class="square" src="images/IMG_7407.jpg" alt="collage of a blue bird flying out of a picture frame" loading="lazy">
        </figure>
        <figure class="snapshot">
          <img class="square" src="images/IMG_7675%20(1)11.jpg" alt="cruise ship and a small boat on calm water, seen through a circular lens" loading="lazy">
        </figure>
        <figure class="snapshot">
          <img class="square" src="images/IMG_9299.jpg" alt="collage of a large butterfly in front of an ornate frame with a blue sky" loading="lazy">
        </figure>
      </div>

      <!-- Landscape photos (4:3) -->
      <div class="gallery">
        <figure class="snapshot">
          <img class="landscape" src="images/IMG_4652.JPG" alt="broken plate and cutlery in a sink of soapy water" loading="lazy">
        </figure>
        <figure class="snapshot">
          <img class="landscape" src="images/IMG_4687.JPG" alt="a cyclist riding between snowy tree trunks" loading="lazy">
        </figure>
        <figure class="snapshot">
          <img class="landscape" src="images/IMG_4688.JPG" alt="people walking through a tunnel toward a snowy park" loading="lazy">
        </figure>
      </div>

      <!-- To add a piece: copy a <figure> block into the group that matches its shape
           (portrait, square or landscape), then change the image file and alt text. -->

    </section>

  </div>

</body>

</html>
