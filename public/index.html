<!DOCTYPE html>
<html lang="en">

<head>
  <!-- ==================================================
       1. PAGE SETTINGS
       ================================================== -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>forlong music</title>

  <!-- Epsy Sans is loaded from style.css (@font-face) -->
  <link rel="stylesheet" href="style.css">

  <!-- Floating iPod mini music player. Songs are listed at the top of ipod/ipod.js -->
  <link rel="stylesheet" href="ipod/ipod.css">
  <script src="ipod/ipod.js" defer></script>

  <!-- Add TailwindCSS, must be added to every page -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body
  class="flex flex-col w-full h-full p-5 bg-indigo-500 bg-[url(images/vhs-bg.jpg)] bg-fill bg-center bg-fixed text-black text-[20px] leading-normal">

  <!-- ==================================================
       2. LOGO  (the dandelion sticker, floating above the box)
       Image file: images/forlong-dandelion.png
       ================================================== -->
  <header class="flex flex-col self-center w-full">
    <img class="self-center w-[92%] max-w-[1326px]" src="images/forlong-dandelion.png" alt="forlong">
    <!-- <p class="tagline">looping, hypnotic bedroom pop</p> -->
  </header>


  <!-- The centered box that holds everything else -->
  <div
    class="max-w-2xl mx-auto p-5 bg-slate-100/90 border-3 border-sky-200 outline-2 outline-dashed outline-cyan-300 outline-offset-4 shadow-xl shadow-indigo-500/60 -mt-[50%]">

    <!-- ==================================================
         3. NAVIGATION  (bracketed text links)
         To add a page: copy one <a> line and change the
         href and the text.
         ================================================== -->
    <nav class="nav">
      <a href="https://www.instagram.com/forlongmusic?psln=MXBtYzBkdXJiaWFvaw%3D%3D&utm_source=qr" title="my ig">
        <img src="images/ig.png" alt="instagram" width="72" height="72">
      </a>
      <span>
        <!-- [<a href="index.html">home</a>] -->
        [<a href="about.html">about</a>]
        [<a href="merch.html">art</a>]
        <!-- [<a href="links.html">links</a>] -->
      </span>
      <a href="https://youtube.com/@forlongmusic" title="my yt">
        <img src="images/yt.png" alt="youtube" width="48" height="48">
      </a>
    </nav>


    <!-- ==================================================
         4. WELCOME  (text on the left, VHS photo on the right)
         Image file: images/vhs-me.jpg
         On phones the photo moves under the text.
         ================================================== -->
    <section class="welcome">
      <div class="welcome-text">
        <h1 class="">forlong</h1>

        <p class="bio">
          <b> looping, poetic bedroom pop, laptop twee, indietronica, and other art</b>
          <!-- <b class="block mt-4">- Monica &amp; Ezra</b> -->
        </p>

        <p class="contact">
          <b>e-mail: <a href="mailto:forlongmusic@gmail.com">forlongmusic@gmail.com</a></b>
        </p>
      </div>
    </section>


    <!-- ==================================================
         5. BANNER  (the guitar-in-the-sky photo)
         Image file: images/guitar-sky.jpg
         ================================================== -->
    <section class="banner-row">
      <img class="banner" src="images/guitar-sky.jpg" alt="playing guitar in the clouds">
    </section>


    <!-- ==================================================
         6. RELEASES
         Newest at the top. One <li> per release.
         ================================================== -->
    <div class="releases-row">
      <section class="recent">
        <h2>upcoming releases:</h2>

        <ul>
          <li><a href="https://forlongmusic.neocities.com">dandelion</a> <span class="tag">single</span></li>
          <li><a href="https://forlongmusic.neocities.com">yesterday's clothes</a> <span class="tag">single</span></li>
          <li><a href="https://forlongmusic.neocities.com">yesterday's clothes</a> <span class="tag">EP</span></li>
        </ul>

        <p class="more"><a href="https://jewelrycompanymusic.com" target="_blank">...more music</a></p>
      </section>

      <!-- VHS video, polaroid style. Files: images/VHS GAS.mp4, images/vhs-me.jpg (poster) -->
      <figure class="snapshot">
        <video src="images/VHS%20GAS.mp4" poster="images/vhs-me.jpg" muted autoplay loop playsinline></video>
      </figure>
    </div>


    <!-- ==================================================
         7. BUTTON WALL  (88x31 buttons linking to friends)
         Copy one <a> block per button.
         ================================================== -->
    <footer class="buttons">
      <a href="https://friendster.com/bob" title="my friendster">
        <!-- <img src="images/friend3.gif" alt="friend 3" width="88" height="31"> -->
      </a>
    </footer>

  </div>

</body>

</html>
